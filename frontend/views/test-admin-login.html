<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h3>🔧 Test Admin Login (Development Only)</h3>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">This page simulates an admin login for testing the dashboard.</p>
                        
                        <div class="mb-3">
                            <label class="form-label">Username:</label>
                            <input type="text" class="form-control" id="testUsername" value="Admin User">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email:</label>
                            <input type="email" class="form-control" id="testEmail" value="admin@test.com">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Role:</label>
                            <select class="form-select" id="testRole">
                                <option value="admin" selected>Admin</option>
                                <option value="user">User</option>
                            </select>
                        </div>
                        
                        <button class="btn btn-primary w-100" onclick="mockLogin()">
                            <i class="fas fa-sign-in-alt me-2"></i>Simulate Login
                        </button>
                        
                        <hr>
                        
                        <button class="btn btn-success w-100 mb-2" onclick="goToDashboard()">
                            <i class="fas fa-tachometer-alt me-2"></i>Go to Dashboard
                        </button>
                        
                        <button class="btn btn-danger w-100" onclick="clearAuth()">
                            <i class="fas fa-trash me-2"></i>Clear Auth Data
                        </button>
                        
                        <div class="mt-3" id="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    
    <script>
        function mockLogin() {
            const username = document.getElementById('testUsername').value;
            const email = document.getElementById('testEmail').value;
            const role = document.getElementById('testRole').value;
            
            // Simulate user and token
            const user = {
                user_id: 1,
                username: username,
                email: email,
                role: role
            };
            
            const token = 'mock_jwt_token_' + Date.now();
            
            // Store in localStorage
            localStorage.setItem('user', JSON.stringify(user));
            localStorage.setItem('token', token);
            localStorage.setItem('currentUser', JSON.stringify(user));
            
            showStatus('✅ Mock login successful! Role: ' + role.toUpperCase(), 'success');
        }
        
        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }
        
        function clearAuth() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            localStorage.removeItem('currentUser');
            showStatus('🗑️ Auth data cleared!', 'warning');
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }
        
        // Check current auth state on load
        window.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('user');
            if (user) {
                const userData = JSON.parse(user);
                showStatus(`Currently logged in as: ${userData.username} (${userData.role})`, 'info');
            } else {
                showStatus('No active session', 'secondary');
            }
        });
    </script>
</body>
</html>
